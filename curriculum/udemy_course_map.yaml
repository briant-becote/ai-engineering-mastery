source_of_truth: User-supplied expanded Udemy lecture outlines (Nov 18, 2026) and the 616-day workbook
notes:
- Only selected public-facing lecture titles/durations are referenced; paid lesson content remains in Udemy.
- Calendar delivery days are not evidence of learner completion or mastery.
- The probability course remains deferred; free academic alternatives are required when unavailable.
- 'Instructor code archives contain .env files and notebook outputs: never copy those archives wholesale into a
  public repository.'
- Guided labs are approved curriculum additions; individual lessons remain subject to review and prerequisite readiness.
- The workbook remains the roadmap; this YAML is the authoritative named-lecture and guided-lab supplement.
