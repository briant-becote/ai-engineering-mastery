[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-mastery"
version = "0.1.0"
description = "A reproducible portfolio for the AI Engineering Mastery curriculum"
requires-python = ">=3.11"
dependencies = [ "tzdata; sys_platform == 'win32'",]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
